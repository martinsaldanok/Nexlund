lan for your digital evolution — step by step, tailored to your budget and the stage of your business.`],[`Fitness & Wellness Tech`,`Specialized support for gyms, physiotherapy centers and Pilates studios. From class management platforms to member apps and online booking tools.`],[`Systems & Integrations`,`We help you connect the tools you already use — CRMs, payment systems, scheduling apps — so your operations run smoothly without manual workarounds.`],[`Ongoing Tech Guidance`,`Technology keeps evolving. We stay by your side as a trusted advisor, so you always know what's relevant for your business and what you can safely ignore.`]],howEye:`Our process`,howTitle:`From first chat to real results.`,howDesc:`No complex contracts, no tech overwhelm. Nexlund solves the everyday tech problems of small and medium businesses with efficient, proven, no-nonsense solutions — without overcomplicating anything. When a need turns out to be more complex, we bring in vetted specialists across AI, automation, e-commerce and beyond, and stay by your side to translate between your business and the technical side — always vendor-agnostic, always with your best interest in mind.`,steps:[[`Free Discovery Call`,`We listen to where you are, what's slowing you down, and what you'd love to improve. No pitch, just a real conversation.`],[`Your Tech Diagnosis`,`We review your current tools, processes and opportunities and give you a clear picture of what's possible — and what makes sense for your situation.`],[`We Build the Path`,`Whether it's connecting you with a software partner, setting up a tool or guiding your team, we handle the complexity so you don't have to.`],[`Grow With Confidence`,`We stay close. As your business evolves, we keep you ahead of the curve — without the stress of figuring out tech on your own.`]],ctaTitle:`Ready to take the next step?`,ctaSub:`Book a free 30-minute call. We'll listen, and you'll leave with clarity — not a sales pitch.`,ctaBtn:`Schedule a call`,foote formation</h3><p>Protecting your personal data matters to us. This privacy policy explains which personal data is processed when you use our website, for what purposes, on what legal bases, and what rights you have.</p><p>Personal data means any information relating to an identified or identifiable natural person. We process personal data exclusively in accordance with the General Data Protection Regulation (GDPR) and applicable national data protection law.</p><p>Please note that data transmission over the internet, for example by e-mail, may involve security risks. Complete protection against access by third parties cannot be guaranteed.</p><h3>2. Controller within the meaning of the GDPR</h3><p>Nexlund Solutions<br>Owner: Martin Saldaño<br>Agricolastraße 25<br>10555 Berlin · Germany<br>Phone: <a href="tel:+4915159457741">+49 1515 945 7741</a><br>E-Mail: <a href="mailto:contact@nexlund.tech">contact@nexlund.tech</a></p><p>A data protection officer has not been appointed, as there is currently no legal obligation to do so.</p><h3>3. Hosting via GitHub Pages</h3><p>This website is provided via GitHub Pages. The provider is GitHub, Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, USA.</p><p>When you access the website, GitHub processes technically necessary connection data, which may include in particular: IP address; date and time of access; the page or file accessed; referrer URL; browser type and version; and operating system and device information.</p><p>This processing takes place to technically provide the website and to ensure its stability and security. The legal basis is Art. 6(1)(f) GDPR. Our legitimate interest lies in the reliable and secure provision of our website.</p><p>According to GitHub, the IP addresses of visitors to GitHub Pages websites are logged for security purposes. Further information is available in GitHub's privacy statement: <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement" target="_blank" rel="noopener">https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement</a></p><p>GitHub may also process data in the USA and other countries. For international data transfers, GitHub states that it relies on recognized transfer mechanisms, in particular the EU-US Data Privacy Framework and the European Commission's Standard Contractual Clauses.</p><h3>4. Google Fonts</h3><p>This website uses Google Fonts for a consistent presentation of typefaces. The provider for users within the European Economic Area is Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Ireland.</p><p>When you access the website, your browser connects to Google's servers to retrieve the required font files. In doing so, information such as your IP address, browser information, device information, and the date and time of access may be transmitted to Google.</p><p>This is done to ensure a consistent and appealing presentation of our website. The legal basis is Art. 6(1)(f) GDPR. Our legitimate interest lies in a technically reliable and consistent presentation of our website.</p><p>Further information on data processing by Google is available at: <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">https://policies.google.com/privacy</a></p><h3>5. Contact via e-mail or phone</h3><p>If you contact us by e-mail or phone, we process the data you provide, which may include in particular your name, contact details, company, and the content of your enquiry.</p><p>This processing takes place to handle and respond to your enquiry. Where your enquiry is directed at concluding or performing a contract, processing is based on Art. 6(1)(b) GDPR. In all other cases, processing is based on our legitimate interest in handling business enquiries pursuant to Art. 6(1)(f) GDPR.</p><p>We use Google's services for e-mail communication. This may involve processing of communication and metadata by Google. Further information is available at: <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">https://policies.google.com/privacy</a></p><p>Data collected in connection with an enquiry is deleted once the enquiry has been conclusively handled, provided there are no statutory retention obligations or legitimate interests in further storage.</p><h3>6. Booking via Calendly</h3><p>Our website contains a link to the scheduling platform Calendly. This service is offered by Calendly, LLC, 115 East Main Street, Suite A1B, Buford, GA 30518, USA.</p><p>Calendly is not directly embedded in this website. Only when you click the relevant link do you leave our website and get redirected to Calendly.</p><p>If you book an appointment there, the following data may in particular be processed: name; e-mail address; the selected time slot; time zone; phone number, where applicable; and any messages or information you voluntarily provide.</p><p>This processing takes place to organize and carry out the appointment you request. The legal basis is Art. 6(1)(b) GDPR, insofar as the appointment serves the performance of pre-contractual measures or a contract. Processing is additionally based on our legitimate interest in efficient scheduling pursuant to Art. 6(1)(f) GDPR.</p><p>Calendly processes the data entered for scheduling on our behalf. Data may also be processed in the USA. For international data transfers, Calendly states that it relies in particular on the EU-US Data Privacy Framework and the European Commission's Standard Contractual Clauses.</p><p>Further information is available in Calendly's privacy notice: <a href="https://calendly.com/legal/privacy-notice" target="_blank" rel="noopener">https://calendly.com/legal/privacy-notice</a></p><h3>7. Cookies, analytics and marketing tracking</h3><p>We do not use our own cookies on this website for analytics, advertising, or marketing purposes.</p><p>We do not use web analytics services such as Google Analytics, no advertising pixels, and no profiling. No automated decision-making within the meaning of Art. 22 GDPR takes place.</p><p>When you move to external services, such as Calendly, the cookie and privacy policies of the respective provider apply.</p><h3>8. Recipients of personal data</h3><p>Personal data is only transferred to external recipients where necessary to provide the website, for communication, for scheduling, to perform a contract, or due to legal obligations.</p><p>Such recipients may in particular include: hosting and IT service providers; communication and e-mail service providers; scheduling providers; tax or legal advisors; and authorities, where a legal obligation exists.</p><p>Service providers who process personal data on our behalf are contractually bound within the scope of legal requirements.</p><h3>9. Transfer of data to third countries</h3><p>Some of the service providers we use are based in the USA or process data outside the European Economic Area.</p><p>Such transfers only take place where the legal requirements of Art. 44 et seq. GDPR are met. Suitable safeguards may include, in particular, an adequacy decision by the European Commission, certification under the EU-US Data Privacy Framework, or the European Commission's Standard Contractual Clauses.</p><h3>10. Storage period</h3><p>We store personal data only for as long as necessary for the respective processing purpose.</p><p>Once the purpose no longer applies, the data is deleted, unless statutory retention periods, contractual obligations, or legitimate interests require further storage. Business and contract documents subject to statutory retention are stored for the respective prescribed period.</p><h3>11. Your rights</h3><p>Subject to the statutory requirements, you have the right to: obtain information about your stored personal data (Art. 15 GDPR); request rectification of inaccurate or incomplete data (Art. 16 GDPR); request erasure of your data (Art. 17 GDPR); request restriction of processing (Art. 18 GDPR); receive your data in a portable format (Art. 20 GDPR); object to the processing of your data (Art. 21 GDPR); and withdraw a consent given at any time for the future (Art. 7(3) GDPR).</p><p>To exercise your rights, a message to <a href="mailto:contact@nexlund.tech">contact@nexlund.tech</a> is sufficient.</p><p>You also have the right to lodge a complaint with a data protection supervisory authority. The authority responsible for us is:</p><p>Berlin Commissioner for Data Protection and Freedom of Information<br>Alt-Moabit 59–61<br>10555 Berlin · Germany<br><a href="https://www.datenschutz-berlin.de" target="_blank" rel="noopener">https://www.datenschutz-berlin.de</a></p><h3>12. Right to object</h3><p>Where we process personal data on the basis of Art. 6(1)(f) GDPR, you have the right to object to this processing at any time for reasons arising from your particular situation.</p><p>We will then no longer process the data concerned, unless we can demonstrate compelling legitimate grounds for the processing, or the processing serves to assert, exercise, or defend legal claims.</p><h3>13. Data security</h3><p>We employ appropriate technical and organizational measures to protect personal data against loss, manipulation, unauthorized access, and other misuse. Our security measures are reviewed and adjusted regularly in line with technical developments.</p><h3>14. Changes to this privacy policy</h3><p>We reserve the right to update this privacy policy if the services we use, our data processing, or legal requirements change.</p><p>As of: August 2026</p>`},de:{imprint:`<h3>Nexlund Solutions</h3><p>Inhaber: Martin Saldaño<br>Agricolastraße 25<br>10555 Berlin<br>Deutschland<br>Umsatzsteuer-Identifikationsnummer: DE463036894</p><h3>Kontakt</h3><p>Telefon: <a href="tel:+4915159457741">+49 1515 945 7741</a><br>E-Mail: <a href="mailto:contact@nexlund.tech">contact@nexlund.tech</a></p><h3>Verbraucherstreitbeilegung</h3><p>Wir sind weder bereit noch verpflichtet, an Streitbeilegungsverfahr h Dritte kann nicht gewährleistet werden.</p><h3>2. Verantwortlicher im Sinne der DSGVO</h3><p>Nexlund Solutions<br>Inhaber: Martin Saldaño<br>Agricolastraße 25<br>10555 Berlin · Deutschland<br>Telefon: <a href="tel:+4915159457741">+49 1515 945 7741</a><br>E-Mail: <a href="mailto:contact@nexlund.tech">contact@nexlund.tech</a></p><p>Ein Datenschutzbeauftragter wurde nicht bestellt, da hierfür derzeit keine gesetzliche Verpflichtung besteht.</p><h3>3. Hosting über GitHub Pages</h3><p>Diese Website wird über GitHub Pages bereitgestellt. Anbieter ist GitHub, Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, USA.</p><p>Beim Aufruf der Website verarbeitet GitHub technisch notwendige Verbindungsdaten. Dazu können insbesondere folgende Informationen gehören: IP-Adresse; Datum und Uhrzeit des Zugriffs; aufgerufene Seite oder Datei; Referrer-URL; Browsertyp und Browserversion; und Betriebssystem und Geräteinformationen.</p><p>Die Verarbeitung erfolgt, um die Website technisch bereitzustellen sowie Stabilität und Sicherheit zu gewährleisten. Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO. Unser berechtigtes Interesse liegt in der zuverlässigen und sicheren Bereitstellung unseres Internetauftritts.</p><p>Nach Angaben von GitHub werden IP-Adressen von Besuchern von GitHub-Pages-Websites zu Sicherheitszwecken protokolliert. Weitere Informationen finden Sie in der Datenschutzerklärung von GitHub: <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement" target="_blank" rel="noopener">https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement</a></p><p>GitHub kann Daten auch in den USA und anderen Staaten verarbeiten. Für internationale Datenübermittlungen verwendet GitHub nach eigenen Angaben anerkannte Übermittlungsmechanismen, insbesondere das EU-US Data Privacy Framework und die Standardvertragsklauseln der Europäischen Kommission.</p><h3>4. Google Fonts</h3><p>Diese Website verwendet zur einheitlichen Darstellung von Schriftarten Google Fonts. Anbieter für Nutzer innerhalb des Europäischen Wirtschaftsraums ist Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Irland.</p><p>Beim Aufruf der Website stellt der Browser eine Verbindung zu den Servern von Google her, um die benötigten Schriftdateien abzurufen. Dabei können insbesondere die IP-Adresse, Browserinformationen, Geräteinformationen sowie Datum und Uhrzeit des Zugriffs an Google übermittelt werden.</p><p>Die Einbindung erfolgt zur einheitlichen und ansprechenden Darstellung unserer Website. Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO. Unser berechtigtes Interesse liegt in einer technisch zuverlässigen und einheitlichen Darstellung unseres Internetauftritts.</p><p>Weitere Informationen zur Datenverarbeitung durch Google finden Sie unter: <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">https://policies.google.com/privacy</a></p><h3>5. Kontaktaufnahme per E-Mail oder Telefon</h3><p>Wenn Sie uns per E-Mail oder Telefon kontaktieren, verarbeiten wir die von Ihnen übermittelten Daten. Dazu können insbesondere Ihr Name, Ihre Kontaktdaten, Ihr Unternehmen sowie der Inhalt Ihrer Anfrage gehören.</p><p>Die Verarbeitung erfolgt zur Bearbeitung und Beantwortung Ihrer Anfrage. Soweit Ihre Anfrage auf den Abschluss oder die Durchführung eines Vertrags gerichtet ist, beruht die Verarbeitung auf Art. 6 Abs. 1 lit. b DSGVO. In allen anderen Fällen erfolgt sie auf Grundlage unseres berechtigten Interesses an der Bearbeitung geschäftlicher Anfragen gemäß Art. 6 Abs. 1 lit. f DSGVO.</p><p>Für die E-Mail-Kommunikation werden Dienste von Google genutzt. Dabei kann eine Verarbeitung von Kommunikations- und Metadaten durch Google stattfinden. Weitere Informationen finden Sie unter: <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">https://policies.google.com/privacy</a></p><p>Die im Rahmen einer Anfrage erhobenen Daten werden gelöscht, sobald die Anfrage abschließend bearbeitet wurde und keine gesetzlichen Aufbewahrungspflichten oder berechtigten Interessen an einer weiteren Speicherung bestehen.</p><h3>6. Terminbuchung über Calendly</h3><p>Auf unserer Website befindet sich ein Link zur Terminbuchungsplattform Calendly. Der Dienst wird von Calendly, LLC, 115 East Main Street, Suite A1B, Buford, GA 30518, USA, angeboten.</p><p>Calendly wird nicht direkt in diese Website eingebettet. Erst wenn Sie den entsprechenden Link anklicken, verlassen Sie unsere Website und werden zu Calendly weitergeleitet.</p><p>Wenn Sie dort einen Termin buchen, werden insbesondere folgende Daten verarbeitet: Name; E-Mail-Adresse; ausgewählter Termin; Zeitzone; gegebenenfalls Telefonnummer; und freiwillig übermittelte Nachrichten oder Informationen.</p><p>Die Verarbeitung erfolgt zur Organisation und Durchführung des von Ihnen gewünschten Termins. Rechtsgrundlage ist Art. 6 Abs. 1 lit. b DSGVO, soweit die Terminvereinbarung der Durchführung vorvertraglicher Maßnahmen oder eines Vertrags dient. Ergänzend beruht die Verarbeitung auf unserem berechtigten Interesse an einer effizienten Terminorganisation gemäß Art. 6 Abs. 1 lit. f DSGVO.</p><p>Calendly verarbeitet die für die Terminvereinbarung eingegebenen Daten in unserem Auftrag. Daten können dabei auch in den USA verarbeitet werden. Calendly stützt internationale Datenübermittlungen nach eigenen Angaben insbesondere auf das EU-US Data Privacy Framework und die Standardvertragsklauseln der Europäischen Kommission.</p><p>Weitere Informationen finden Sie in der Datenschutzerklärung von Calendly: <a href="https://calendly.com/legal/privacy-notice" target="_blank" rel="noopener">https://calendly.com/legal/privacy-notice</a></p><h3>7. Cookies, Analyse und Marketing-Tracking</h3><p>Wir setzen auf dieser Website keine eigenen Cookies zu Analyse-, Werbe- oder Marketingzwecken ein.</p><p>Wir verwenden keine Webanalyse-Dienste wie Google Analytics, keine Werbepixel und kein Profiling. Es findet keine automatisierte Entscheidungsfindung im Sinne von Art. 22 DSGVO statt.</p><p>Beim Wechsel zu externen Angeboten, beispielsweise Calendly, gelten die Cookie- und Datenschutzbestimmungen des jeweiligen Anbieters.</p><h3>8. Empfänger personenbezogener Daten</h3><p>Personenbezogene Daten werden nur an externe Empfänger übermittelt, soweit dies zur Bereitstellung der Website, zur Kommunikation, zur Terminorganisation, zur Erfüllung eines Vertrags oder aufgrund gesetzlicher Verpflichtungen erforderlich ist.</p><p>Zu diesen Empfängern können insbesondere gehören: Hosting- und IT-Dienstleister; Kommunikations- und E-Mail-Dienstleister; Terminbuchungsanbieter; steuerliche oder rechtliche Berater; und Behörden, soweit eine gesetzliche Verpflichtung besteht.</p><p>Dienstleister, die personenbezogene Daten in unserem Auftrag verarbeiten, werden im Rahmen der gesetzlichen Anforderungen vertraglich verpflichtet.</p><h3>9. Übermittlung von Daten in Drittländer</h3><p>Einige der eingesetzten Dienstleister haben ihren Sitz in den USA oder verarbeiten Daten außerhalb des Europäischen Wirtschaftsraums.</p><p>Eine Übermittlung erfolgt nur, wenn die gesetzlichen Voraussetzungen der Art. 44 ff. DSGVO erfüllt sind. Als geeignete Garantien können insbesondere ein Angemessenheitsbeschluss der Europäischen Kommission, eine Zertifizierung nach dem EU-US Data Privacy Framework oder die Standardvertragsklauseln der Europäischen Kommission dienen.</p><h3>10. Speicherdauer</h3><p>Wir speichern personenbezogene Daten nur so lange, wie dies für den jeweiligen Verarbeitungszweck erforderlich ist.</p><p>Nach Wegfall des Zwecks werden die Daten gelöscht, sofern keine gesetzlichen Aufbewahrungsfristen, vertraglichen Verpflichtungen oder berechtigten Interessen an einer weiteren Speicherung bestehen. Gesetzlich aufzubewahrende Geschäfts- und Vertragsunterlagen werden für die jeweils vorgeschriebene Dauer gespeichert.</p><h3>11. Ihre Rechte</h3><p>Sie haben im Rahmen der gesetzlichen Voraussetzungen das Recht: Auskunft über Ihre gespeicherten personenbezogenen Daten zu erhalten (Art. 15 DSGVO); die Berichtigung unrichtiger oder unvollständiger Daten zu verlangen (Art. 16 DSGVO); die Löschung Ihrer Daten zu verlangen (Art. 17 DSGVO); die Einschränkung der Verarbeitung zu verlangen (Art. 18 DSGVO); Ihre Daten in einem übertragbaren Format zu erhalten (Art. 20 DSGVO); der Verarbeitung Ihrer Daten zu widersprechen (Art. 21 DSGVO); und eine erteilte Einwilligung jederzeit für die Zukunft zu widerrufen (Art. 7 Abs. 3 DSGVO).</p><p>Zur Ausübung Ihrer Rechte genügt eine Nachricht an <a href="mailto:contact@nexlund.tech">contact@nexlund.tech</a>.</p><p>Sie haben außerdem das Recht, sich bei einer Datenschutzaufsichtsbehörde zu beschweren. Die für uns zuständige Aufsichtsbehörde ist:</p><p>Berliner Beauftragte für Datenschutz und Informationsfreiheit<br>Alt-Moabit 59–61<br>10555 Berlin · Deutschland<br><a href="https://www.datenschutz-berlin.de" target="_blank" rel="noopener">https://www.datenschutz-berlin.de</a></p><h3>12. Widerspruch gegen die Verarbeitung</h3><p>Soweit wir personenbezogene Daten auf Grundlage von Art. 6 Abs. 1 lit. f DSGVO verarbeiten, können Sie aus Gründen, die sich aus Ihrer besonderen Situation ergeben, jederzeit Widerspruch gegen die Verarbeitung einlegen.</p><p>Wir werden die betroffenen Daten anschließend nicht mehr verarbeiten, es sei denn, wir können zwingende schutzwürdige Gründe für die Verarbeitung nachweisen oder die Verarbeitung dient der Geltendmachung, Ausübung oder Verteidigung von Rechtsansprüchen.</p><h3>13. Datensicherheit</h3><p>Wir setzen angemessene technische und organisatorische Maßnahmen ein, um personenbezogene Daten vor Verlust, Manipulation, unbefugtem Zugriff und sonstigem Missbrauch zu schützen. Unsere Sicherheitsmaßnahmen werden entsprechend der technischen Entwicklung regelmäßig überprüft und angepasst.</p><h3>14. Änderungen dieser Datenschutzerklärung</h3><p>Wir behalten uns vor, diese Datenschutzerklärung anzupassen, wenn sich die eingesetzten Dienste, die Datenverarbeitung oder die gesetzlichen Anforderungen ändern.</p><p>Stand: August 2026</p>`},es:{imprint:`<h3>Nexlund Solutions</h3><p>Titular: Martin Saldaño<br>Agricolastraße 25<br>10555 Berlín<br>Alemania<br>Número de identificación fiscal alemán: DE463036894</p><h3>Contacto</h3><p>Teléfono: <a href="tel:+4915159457741">+49 1515 945 7741</a><br>Correo electrónico: <a href="mailto:contact@nexlund.tech">contact@nexlund.tech</a></p><h3>Resolución de litigios de consumo</h3><p>No estamos dispuestos ni obligados a participar en procedimientos de resolución de litigios ante un organismo de arbitraje de consumo.</p><h3>Responsabilidad por el contenido</h3><p>Como proveedor de servicios, somos responsables de nuestro propio contenido en este sitio web de acuerdo con la legislación general. Elaboramos el contenido de este sitio web con el máximo cuidado posible. Sin embargo, no podemos garantizar la exactitud, integridad o actualidad del contenido proporcionado.</p><h3>Responsabilidad por enlaces externos</h3><p>Este sitio web contiene enlaces a sitios web externos de terceros sobre cuyo contenido no tenemos influencia. El respectivo proveedor u operador de las páginas enlazadas es siempre responsable de su contenido. Si tomamos conocimiento de infracciones legales en páginas enlazadas, eliminaremos los enlaces correspondientes de inmediato.</p><h3>Derechos de autor</h3><p>Los contenidos y obras creados en este sitio web están sujetos a la ley alemana de derechos de autor. Cualquier reproducción, edición, distribución o uso fuera de los límites de la ley de derechos de autor requiere el consentimiento previo por escrito del respectivo titular de los derechos.</p><p>Actualizado: agosto de 2026</p>`,privacy:`<h3>1. Información general</h3><p>La protección de tus datos personales es importante para nosotros. Esta política de privacidad te informa sobre qué datos personales se procesan al usar nuestro sitio web, con qué fines, sobre qué bases legales, y qué derechos te corresponden.</p><p>Los datos personales son toda la información relativa a una persona física identificada o identificable. Tratamos los datos personales exclusivamente de conformidad con el Reglamento General de Protección de Datos (RGPD) y la normativa nacional de protección de datos aplicable.</p><p>Tené en cuenta que la transmisión de datos por Internet, por ejemplo en la comunicación por correo electrónico, puede presentar riesgos de seguridad. No es posible garantizar una protección completa frente al acceso de terceros.</p><h3>2. Responsable en el sentido del RGPD</h3><p>Nexlund Solutions<br>Titular: Martin Saldaño<br>Agricolastraße 25<br>10555 Berlín · Alemania<br>Teléfono: <a href="tel:+4915159457741">+49 1515 945 7741</a><br>Correo electrónico: <a href="mailto:contact@nexlund.tech">contact@nexlund.tech</a></p><p>No se ha designado un delegado de protección de datos, ya que actualmente no existe obligación legal de hacerlo.</p><h3>3. Alojamiento a través de GitHub Pages</h3><p>Este sitio web se ofrece a través de GitHub Pages. El proveedor es GitHub, Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, EE. UU.</p><p>Al acceder al sitio web, GitHub procesa datos de conexión técnicamente necesarios, que pueden incluir en particular: dirección IP; fecha y hora del acceso; página o archivo consultado; URL de referencia; tipo y versión del navegador; y sistema operativo e información del dispositivo.</p><p>Este tratamiento tiene como finalidad la provisión técnica del sitio web y garantizar su estabilidad y seguridad. La base legal es el art. 6.1.f RGPD. Nuestro interés legítimo consiste en ofrecer nuestro sitio web de forma fiable y segura.</p><p>Según GitHub, las direcciones IP de los visitantes de sitios alojados en GitHub Pages se registran con fines de seguridad. Encontrarás más información en la declaración de privacidad de GitHub: <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement" target="_blank" rel="noopener">https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement</a></p><p>GitHub también puede procesar datos en EE. UU. y otros países. Para las transferencias internacionales de datos, GitHub declara basarse, en particular, en el EU-US Data Privacy Framework y en las cláusulas contractuales tipo de la Comisión Europea.</p><h3>4. Google Fonts</h3><p>Este sitio web utiliza Google Fonts para una presentación uniforme de las tipografías. El proveedor para usuarios dentro del Espacio Económico Europeo es Google Ireland Limited, Gordon House, Barrow Street, Dublín 4, Irlanda.</p><p>Al acceder al sitio web, tu navegador establece una conexión con los servidores de Google para obtener los archivos de fuentes necesarios. En este proceso pueden transmitirse a Google, entre otros datos, tu dirección IP, información del navegador, información del dispositivo, así como la fecha y hora del acceso.</p><p>Esta integración tiene como finalidad una presentación uniforme y atractiva de nuestro sitio web. La base legal es el art. 6.1.f RGPD. Nuestro interés legítimo consiste en una presentación técnicamente fiable y uniforme de nuestro sitio web.</p><p>Más información sobre el tratamiento de datos por parte de Google en: <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">https://policies.google.com/privacy</a></p><h3>5. Contacto por correo electrónico o teléfono</h3><p>Si nos contactás por correo electrónico o teléfono, tratamos los datos que nos proporcionás, que pueden incluir en particular tu nombre, tus datos de contacto, tu empresa y el contenido de tu consulta.</p><p>Este tratamiento tiene como finalidad gestionar y responder tu consulta. En la medida en que tu consulta esté dirigida a la celebración o ejecución de un contrato, el tratamiento se basa en el art. 6.1.b RGPD. En los demás casos, se basa en nuestro interés legítimo en gestionar consultas comerciales conforme al art. 6.1.f RGPD.</p><p>Para la comunicación por correo electrónico utilizamos servicios de Google. Esto puede implicar el tratamiento de datos de comunicación y metadatos por parte de Google. Más información en: <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">https://policies.google.com/privacy</a></p><p>Los datos recogidos en el marco de una consulta se eliminan una vez que esta ha sido atendida de forma definitiva, siempre que no existan obligaciones legales de conservación ni intereses legítimos en un almacenamiento posterior.</p><h3>6. Reservas a través de Calendly</h3><p>Nuestro sitio web contiene un enlace a la plataforma de reservas Calendly. El servicio es ofrecido por Calendly, LLC, 115 East Main Street, Suite A1B, Buford, GA 30518, EE. UU.</p><p>Calendly no está integrado directamente en este sitio web. Solo al hacer clic en el enlace correspondiente abandonás nuestro sitio y sos redirigido a Calendly.</p><p>Si reservás una cita allí, se pueden tratar en particular los siguientes datos: nombre; dirección de correo electrónico; horario seleccionado; zona horaria; número de teléfono, en su caso; y cualquier mensaje o información que proporciones voluntariamente.</p><p>Este tratamiento tiene como finalidad organizar y llevar a cabo la cita solicitada. La base legal es el art. 6.1.b RGPD, en la medida en que la cita sirva a la ejecución de medidas precontractuales o de un contrato. De forma complementaria, el tratamiento se basa en nuestro interés legítimo en una organización eficiente de citas conforme al art. 6.1.f RGPD.</p><p>Calendly trata los datos introducidos para la reserva por encargo nuestro. Los datos también pueden tratarse en EE. UU. Para las transferencias internacionales de datos, Calendly declara basarse, en particular, en el EU-US Data Privacy Framework y en las cláusulas contractuales tipo de la Comisión Europea.</p><p>Más información en el aviso de privacidad de Calendly: <a href="https://calendly.com/legal/privacy-notice" target="_blank" rel="noopener">https://calendly.com/legal/privacy-notice</a></p><h3>7. Cookies, analítica y seguimiento de marketing</h3><p>No utilizamos cookies propias en este sitio web con fines de analítica, publicidad o marketing.</p><p>No utilizamos servicios de analítica web como Google Analytics, ni píxeles publicitarios, ni profiling. No se produce ninguna toma de decisiones automatizada en el sentido del art. 22 RGPD.</p><p>Al acceder a servicios externos, como Calendly, se aplican las políticas de cookies y privacidad del respectivo proveedor.</p><h3>8. Destinatarios de datos personales</h3><p>Los datos personales solo se transmiten a destinatarios externos cuando sea necesario para prestar el sitio web, para la comunicación, para la organización de citas, para la ejecución de un contrato o por obligaciones legales.</p><p>Estos destinatarios pueden incluir en particular: proveedores de hosting y servicios de TI; proveedores de comunicación y correo electrónico; proveedores de reserva de citas; asesores fiscales o legales; y autoridades, cuando exista una obligación legal.</p><p>Los proveedores que tratan datos personales por nuestro encargo están vinculados contractualmente conforme a los requisitos legales.</p><h3>9. Transferencia de datos a terceros países</h3><p>Algunos de los proveedores que utilizamos tienen su sede en EE. UU. o tratan datos fuera del Espacio Económico Europeo.</p><p>Dicha transferencia solo se produce cuando se cumplen los requisitos legales de los arts. 44 y siguientes del RGPD. Como garantías adecuadas pueden servir, en particular, una decisión de adecuación de la Comisión Europea, una certificación conforme al EU-US Data Privacy Framework, o las cláusulas contractuales tipo de la Comisión Europea.</p><h3>10. Plazo de conservación</h3><p>Almacenamos los datos personales solo durante el tiempo necesario para la respectiva finalidad del tratamiento.</p><p>Una vez desaparecida la finalidad, los datos se eliminan, salvo que existan plazos legales de conservación, obligaciones contractuales o intereses legítimos que requieran un almacenamiento posterior. Los documentos comerciales y contractuales sujetos a conservación legal se almacenan durante el plazo correspondiente.</p><h3>11. Tus derechos</h3><p>Dentro de los requisitos legales, tenés derecho a: obtener información sobre tus datos personales almacenados (art. 15 RGPD); solicitar la rectificación de datos inexactos o incompletos (art. 16 RGPD); solicitar la supresión de tus datos (art. 17 RGPD); solicitar la limitación del tratamiento (art. 18 RGPD); recibir tus datos en un formato portable (art. 20 RGPD); oponerte al tratamiento de tus datos (art. 21 RGPD); y retirar en cualquier momento, con efectos futuros, un consentimiento otorgado (art. 7.3 RGPD).</p><p>Para ejercer tus derechos, basta con un mensaje a <a href="mailto:contact@nexlund.tech">contact@nexlund.tech</a>.</p><p>También tenés derecho a presentar una reclamación ante una autoridad de control en materia de protección de datos. La autoridad competente para nosotros es:</p><p>Comisionada de Berlín para la Protección de Datos y la Libertad de Información<br>Alt-Moabit 59–61<br>10555 Berlín · Alemania<br><a href="https://www.datenschutz-berlin.de" target="_blank" rel="noopener">https://www.datenschutz-berlin.de</a></p><h3>12. Derecho de oposición</h3><p>Cuando tratamos datos personales sobre la base del art. 6.1.f RGPD, tenés derecho a oponerte en cualquier momento a dicho tratamiento por razones derivadas de tu situación particular.</p><p>En ese caso, dejaremos de tratar los datos afectados, salvo que podamos acreditar motivos legítimos imperiosos para el tratamiento, o que este sirva para la formulación, el ejercicio o la defensa de reclamaciones legales.</p><h3>13. Seguridad de los datos</h3><p>Aplicamos medidas técnicas y organizativas adecuadas para proteger los datos personales frente a pérdida, manipulación, acceso no autorizado y cualquier otro uso indebido. Nuestras medidas de seguridad se revisan y adaptan periódicamente conforme a la evolución técnica.</p><h3>14. Cambios en esta política de privacidad</h3><p>Nos reservamos el derecho de actualizar esta política de privacidad si cambian los servicios que utilizamos, el tratamiento de datos o los requisitos legales.</p><p>Actualizado: agosto de 2026</p>`}};function b(){let[e,t]=(0,f.useState)(`en`),[n,r]=(0,f.useState)(!1),[i,a]=(0,f.useState)(null),o=m[e];return(0,f.useEffect)(()=>{document.documentElement.lang=e},[e]),(0,f.useEffect)(()=>{document.body.style.overflow=i?`hidden`:``;let e=e=>e.key===`Escape`&&a(null);return window.addEventListener(`keydown`,e),()=>window.removeEventListener(`keydown`,e)},[i]),(0,p.jsxs)(`main`,{children:[(0,p.jsxs)(`header`,{className:`site-header`,children:[(0,p.jsx)(g,{}),(0,p.jsxs)(`nav`,{"aria-label":`Main navigation`,children:[(0,p.jsx)(`a`,{href:`#services`,children:o.navServices}),(0,p.jsx)(`a`,{href:`#how`,children:o.navHow}),(0,p.jsx)(`a`,{href:`#contact`,children:o.navContact})]}),(0,p.jsxs)(`div`,{className:`header-actions`,children:[(0,p.jsx)(`div`,{className:`language`,"aria-label":`Language selector`,children:[`en`,`de`,`es`].map(n=>(0,p.jsx)(`button`,{className:e===n?`active`:``,onClick:()=>t(n),children:n},n))}),(0,p.jsx)(`a`,{className:`nav-cta`,href:`#contact`,children:o.navBook})]}),(0,p.jsxs)(`button`,{className:`menu-button ${n?`open`:``}`,onClick:()=>r(!n),"aria-label":`Toggle menu`,"aria-expanded":n,children:[(0,p.jsx)(`i`,{}),(0,p.jsx)(`i`,{}),(0,p.jsx)(`i`,{})]})]}),(0,p.jsxs)(`div`,{className:`mobile-nav ${n?`open`:``}`,children:[(0,p.jsx)(`a`,{onClick:()=>r(!1),href:`#services`,children:o.navServices}),(0,p.jsx)(`a`,{onClick:()=>r(!1),href:`#how`,children:o.navHow}),(0,p.jsx)(`a`,{onClick:()=>r(!1),href:`#contact`,children:o.navContact}),(0,p.jsx)(`div`,{className:`language`,children:[`en`,`de`,`es`].map(n=>(0,p.jsx)(`button`,{className:e===n?`active`:``,onClick:()=>t(n),children:n},n))})]}),(0,p.jsxs)(`section`,{className:`he
